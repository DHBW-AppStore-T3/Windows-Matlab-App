# App contract v2: Windows 11 Desktop mit MATLAB R2024b als KubeVirt-VM,
# eine VM pro Person, Zugang per noVNC im Browser.
# Das Golden-Image liegt als Cinder-PVC in Namespace vm-poc.
# MATLAB ist vorinstalliert — Start in unter 2 Minuten.
apiVersion: appstore/v2
name: windows-matlab-app
runtime: kubevirt-vm
scope: user
vm:
  cpuCores: 4
  memoryGiB: 8
  diskGiB: 90
  imageRef: windows11-matlab-golden
  storageClass: cinder
  vncAccess: true
  # Was Personen im Wizard wählen dürfen (Standard: die Werte oben).
  bounds:
    cpuCores: { min: 2, max: 8 }
    memoryGiB: { min: 4, max: 16 }
# What the desktops may reach (the contract: app-registry README, "network"). MATLAB's named-user licence (the MathWorks
# account) is activated and checked online, and the desktop updates itself: it starts on. A teacher can switch it off
# for a course that only works in an already activated desktop (an exam). The desktops of one deployment may reach each
# other (all ports) only if chosen: off by default.
network:
  internet: { allowed: true, default: true }
  podNetwork: { allowed: true, default: false }
access:
  - { type: url, template: "https://{workload}-{deployment}.{domain}" }
  - { type: password, from: generated-password, username: "{user}" }
