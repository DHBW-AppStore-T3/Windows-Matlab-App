# App contract v2: Windows 11 Desktop mit MATLAB R2024b als KubeVirt-VM,
# eine VM pro Person, Zugang per noVNC im Browser.
# Das Golden-Image liegt als Cinder-PVC in Namespace vm-poc.
# MATLAB ist vorinstalliert — Start in unter 2 Minuten.
apiVersion: appstore/v2
name: windows-matlab-app
runtime: kubevirt-vm
scope: user
vm:
  cpuCores: 4
  memoryGiB: 8
  diskGiB: 90
  imageRef: windows11-matlab-golden
  storageClass: cinder
  vncAccess: true
  # Was Personen im Wizard wählen dürfen (Standard: die Werte oben).
  bounds:
    cpuCores: { min: 2, max: 8 }
    memoryGiB: { min: 4, max: 16 }
egress: internet
userChoices: { internet: true, podNetwork: true }
access:
  - { type: url, template: "https://{workload}-{deployment}.{domain}" }
  - { type: password, from: generated-password, username: "{user}" }
